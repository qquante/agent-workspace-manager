version: 1

roles:
  admin:
    permissions:
      - mcp.approve
      - policy.read
      - policy.reload
      - workspace.create
      - workspace.read
      - usage.write
      - usage.read
      - llm.key.create
      - llm.key.read
  operator:
    permissions:
      - mcp.approve
      - policy.read
      - workspace.create
      - workspace.read
      - usage.read
      - llm.key.read

users:
  - id: admin
    roles:
      - admin
    # Generate locally:
    #   powershell: [BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("REPLACE_WITH_RANDOM_TOKEN"))).Replace("-", "").ToLower()
    # Never commit or paste the raw token.
    token_sha256: REPLACE_WITH_SHA256_HEX
